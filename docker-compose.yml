name: habittracker

volumes:
  habit-storage:

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: habittracker-app:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - habit-storage:/var/www/html/storage
      - ./public:/var/www/html/public:ro
    healthcheck:
      test: ["CMD", "cgi-fcgi", "-bind", "-connect", "127.0.0.1:9000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8095:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - habit-storage:/var/www/html/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
