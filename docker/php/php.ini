; 200M covers the exercise-file cap (max:51200 KB = 50MB), the intro-video
; single-shot XHR path, and the App Release APK upload (Filament FileUpload,
; single-shot, up to 200MB — see AppReleaseResource::form()). Lesson videos
; no longer need a large limit here at all — TUS uploads
; (course-builder.blade.php's lessonModalUploader) stream in 5MB PATCH chunks
; via raw php://input, not $_FILES, so upload_max_filesize doesn't gate them;
; post_max_size still bounds each chunk's request body.
upload_max_filesize = 200M
post_max_size = 200M
memory_limit = 256M
max_execution_time = 300
max_input_time = 300

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
