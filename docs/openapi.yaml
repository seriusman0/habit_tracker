openapi: "3.0.0"
info:
  title: HabitShare REST API
  version: 1.0.0
  description: REST API untuk pengembang Android (HabitShare)
servers:
  - url: http://localhost:8000
paths:
  /api/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, device_name]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                device_name: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: "#/components/schemas/User" }
  /api/habits:
    get:
      summary: List habits
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Habit" }
  /api/habits/{habit}/toggle:
    post:
      summary: Toggle habit
      security: [{ bearerAuth: [] }]
      parameters:
        - name: habit
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [done, none] }
      responses:
        "200":
          description: OK
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        roles: { type: array, items: { type: string } }
    Habit:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        category: { $ref: "#/components/schemas/Category" }
    Category:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
